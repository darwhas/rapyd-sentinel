apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: sentinel-gateway
  labels:
    app: proxy
spec:
  # Internet-facing ELB placed in vpc-gateway public subnets
  # (tagged kubernetes.io/role/elb). Nodes stay private.
  type: LoadBalancer
  selector:
    app: proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
